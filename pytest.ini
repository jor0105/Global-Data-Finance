[pytest]
# Configuração do pytest

# Diretórios de teste
testpaths = tests
pythonpath = .

# Padrão de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções padrão
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --maxfail=1
    --strict-config
    -ra
    --ignore=tests/perf

# Marcadores customizados
markers =
    unit: Testes unitários (rápidos, isolados)
    integration: Testes de integração (requerem APIs externas)
    slow: Testes lentos (> 1 segundo)
    asyncio: Testes assíncronos
    perf: Microbenchmarks opt-in (rodar com `pytest tests/perf -m perf`)

# Configuração de asyncio para pytest-asyncio
# asyncio_mode = auto

# Coverage settings are NOT configured here. coverage.py only reads
# .coveragerc, setup.cfg, tox.ini and pyproject.toml -- never pytest.ini --
# so [coverage:*] sections in this file are silently ignored. They live in
# [tool.coverage.*] in pyproject.toml.
