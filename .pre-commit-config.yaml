# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Hook stages
# -----------
#   pre-commit : local integrity, type, test and dependency checks
#   commit-msg : Conventional Commits validation
#   pre-push   : repeat the full local gate before publishing a branch
#
# Install every stage with:  uv run pre-commit install --install-hooks
---
minimum_pre_commit_version: "3.2.0"

default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Without this, every hook that omits `stages` would also re-run on push.
default_stages: [pre-commit]

# No `default_language_version` on purpose. Pinning `python3.12` here made
# every hook env depend on that exact interpreter being on PATH -- which the
# CI matrix (3.12/3.13/3.14) only satisfies by accident, because the current
# ubuntu-latest image happens to ship 3.12 as its system Python. When that
# image moves on, the pin would break every job at once. These hooks are
# standalone tools (ruff, yamllint, codespell, mdformat); they are not the
# code under test, and any interpreter meeting requires-python runs them
# identically. The project's own Python is pinned where it matters, in
# [project] requires-python and the CI matrix.

# Keep exclusions hook-local. A global filter would make generated or artifact
# paths invisible to every scanner, including security hooks. A hook that
# cannot process a specific generated input must declare its own `exclude`.

repos:
  # --------------------------------------------------------------------------
  # 0. Commit Message Validation (Conventional Commits - simplified)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: validate-commit-msg
        entry: .github/hooks/validate-commit-msg.sh
        language: script
        stages: [commit-msg]

      # Agent harness: .agents/ is the source of truth and .claude, .codex,
      # .github/{agents,prompts}, .opencode and opencode.json are generated
      # from it. Every mirror is gitignored, so this can only be an
      # always_run check -- no staged path will ever match them.
      #
      # `validate-skills-metadata` used to sit here. It was removed rather
      # than fixed: its `files: SKILL.md` pattern could never match (all
      # SKILL.md live under the gitignored .agents/), and the validator
      # currently exits 1 on two harness content issues. Re-add it as an
      # always_run hook once .agents/scripts/validate-skills.py is green.
      - id: check-harness-sync
        name: check-harness-sync
        entry: bash .github/hooks/check-harness-sync.sh
        language: system
        pass_filenames: false
        always_run: true

  # --------------------------------------------------------------------------
  # 1. Basic File Checks
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-ast
      - id: check-added-large-files
        args: ["--maxkb=1500"]
        # Generated lock file; growing past the limit is legitimate.
        exclude: ^uv\.lock$
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: forbid-submodules
      - id: name-tests-test
        args: ["--pytest-test-first"]

  # --------------------------------------------------------------------------
  # 2. Project Integrity (uv)
  # --------------------------------------------------------------------------
  # Keep this rev in sync with the uv version used locally and in CI: an
  # older/newer uv here will rewrite uv.lock on every commit.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.11
    hooks:
      - id: uv-lock

  # --------------------------------------------------------------------------
  # 3. Security Checks
  # --------------------------------------------------------------------------
  # Static security analysis is handled by Ruff's `S` (flake8-bandit) rules,
  # configured in pyproject.toml -- no separate Bandit hook needed.

  # Secret Detection: detect-secrets (baseline-driven, entropy + plugins)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(package\.lock|\.secrets\.baseline)

  # Secret Detection: gitleaks (provider-specific token patterns)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # CI/CD supply-chain audit of GitHub Actions workflows
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  # --------------------------------------------------------------------------
  # 4. Formatting & Linting
  # --------------------------------------------------------------------------
  # Ruff owns Python lint (incl. security `S`, docstrings `D`) and formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        # `--number` keeps 1./2./3. numbering instead of collapsing every
        # ordered-list item to "1.", which reads badly in raw Markdown.
        args: ["--number"]
        additional_dependencies: ["mdformat-gfm==1.0.0"]
        # .agents/ is the source of truth; .claude/, .codex/, .opencode/ and
        # .github/prompts/ are generated from it. Every mirror is gitignored
        # today, so none of them reach pre-commit -- this is a guard against a
        # mirror being tracked later and then reformatted into permanent drift.
        exclude: |
          (?x)^(
            \.agents/|
            \.claude/|
            \.codex/|
            \.opencode/|
            \.github/prompts/|
            openspec/
          )

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words=.codespellignore"]
        exclude: ^(uv\.lock|\.secrets\.baseline)$

  # --------------------------------------------------------------------------
  # 4.1. Import Graph
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: import-cycles
        name: import-cycles
        entry: uv run python .github/hooks/check-import-cycles.py
        language: system
        types: [python]
        pass_filenames: false

      # Layer contracts live in [tool.importlinter] in pyproject.toml.
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false

  # --------------------------------------------------------------------------
  # 5. Type Checking
  # --------------------------------------------------------------------------
  # Runs inside the uv environment so mypy actually sees pydantic, polars,
  # pyarrow and httpx types -- a hook-isolated mypy would silently treat every
  # third-party import as `Any`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        files: ^src/.*\.py$
        pass_filenames: false

      - id: mypy-supporting
        name: mypy-supporting
        entry: uv run mypy src tests examples .github/hooks --disable-error-code no-untyped-def
        language: system
        files: ^(tests|examples|\.github/hooks)/.*\.py$
        pass_filenames: false

  # --------------------------------------------------------------------------
  # 6. Full local checks (pre-commit and pre-push)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: max-lines-per-file
        name: max-lines-per-file
        entry: bash .github/hooks/check-max-lines.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      # Same selection as the CI `quality` job. Bare `--cov` picks up source
      # and the fail_under floor from [tool.coverage.*] in pyproject.toml,
      # so the gate is defined in exactly one place.
      - id: pytest-unit
        name: pytest-unit
        entry: uv run pytest -q -m "not integration and not slow" --cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: pip-audit
        name: pip-audit
        # Do not suppress dependency advisories. Documentation-only
        # dependencies still execute in local build and CI environments.
        entry: uv run pip-audit .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
