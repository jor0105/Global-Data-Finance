# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # --------------------------------------------------------------------------
  # 0. Commit Message Validation (Conventional Commits - simplified)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: validate-commit-msg
        entry: .github/hooks/validate-commit-msg.sh
        language: script
        stages: [commit-msg]

      - id: standardization-build
        name: standardization-build
        entry: uv run python scripts/build_standardization_specs.py
        language: system
        files: ^src/domain/change_datas/.*\.json$
        pass_filenames: false

      - id: validate-skills-metadata
        name: validate-skills-metadata
        entry: uv run python .agents/scripts/validate-skills.py
        language: system
        files: (^|/)(SKILL\.md)$
        pass_filenames: false
  # --------------------------------------------------------------------------
  # 1. Basic File Checks
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-ast
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-case-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  # --------------------------------------------------------------------------
  # 2. Project Integrity (uv)
  # --------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.18
    hooks:
      - id: uv-lock

  # Max lines per file (src + backend)
  # - repo: local
  #   hooks:
  #     - id: max-lines-per-file
  #       name: max-lines-per-file
  #       entry: bash .github/hooks/check-max-lines.sh
  #       language: system
  #       pass_filenames: false
  #       always_run: true

  # --------------------------------------------------------------------------
  # 3. Security Checks
  # --------------------------------------------------------------------------
  # Static Analysis for Security (Bandit)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|.agents/scripts/|.agents/skills/.*/scripts/)

  # Dependency Vulnerabilities (pip-audit)
  # Runs locally using the project's environment
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit .
        language: system
        pass_filenames: false
        always_run: true

  # Secret Detection (detect-secrets)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.lock

  # --------------------------------------------------------------------------
  # 4. Formatting & Linting (Ruff replaces isort/flake8)
  # --------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --------------------------------------------------------------------------
  # 4.1. Unit Tests (Fast)
  # --------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest-unit
        entry: uv run pytest -q -m "not integration and not slow"
        language: system
        pass_filenames: false
        always_run: true

  # --------------------------------------------------------------------------
  # 5. Type Checking
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --pretty, --no-incremental]
        additional_dependencies: [types-requests, types-toml, types-PyYAML]
        exclude: ^examples/|^teste_site/|^\.github/|^\.agents/

  # --------------------------------------------------------------------------
  # 6. Documentation
  # --------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args:
          - --convention=google
          - --match-dir=^src
          - --add-ignore=D100,D101,D102,D103,D104,D105,D107,D205,D212,D415,D417
