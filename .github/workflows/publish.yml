---
name: CD - Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # IMPORTANT: required for trusted publishing

jobs:
  # --------------------------------------------------------------------------
  # Security Scan before Publishing
  # --------------------------------------------------------------------------
  security-scan:
    name: Security scan before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Security analysis with Bandit
        run: |
          uv run bandit -c pyproject.toml -r src -ll
          echo "✅ Security analysis passed"

      - name: Check for vulnerable dependencies
        run: |
          uv run pip-audit --ignore-vuln PYSEC-2026-89
          echo "✅ No vulnerable dependencies in release"

  # --------------------------------------------------------------------------
  # Build and Publish
  # --------------------------------------------------------------------------
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: security-scan # Only publish if security checks pass
    environment:
      name: release
      url: https://pypi.org/project/globaldatafinance/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build package
        run: uv build

      - name: Check package distribution
        run: uv run twine check dist/*

      - name: Publish to PyPI using Trusted Publishers
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          verbose: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          retention-days: 30
