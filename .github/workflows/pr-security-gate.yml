name: PR Security Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

      - name: Enforce bundle budget
        run: npm run bundle:check

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        run: uv sync --project backend --frozen --group dev

      - name: Lint backend
        run: uv run --project backend ruff check backend

      - name: Run backend quality gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --project backend pytest \
            backend/tests/unit/test_import_architecture.py \
            backend/tests/integration/test_agent_runtime_tools.py \
            backend/tests/contracts/test_workspace_platform_api.py \
            backend/tests/integration/test_agent_tools_mcp_adapter.py \
            backend/tests/unit/test_semantic_taxonomy_registry.py \
            -q

  backend-startup-security:
    name: Backend Startup Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        run: uv sync --project backend --frozen --group dev

      - name: Run startup fail-closed tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --project backend pytest \
            backend/tests/security/test_data_api_security.py \
            -k "backend_startup_requires_supabase_and_secret_key or backend_supports_file_delivered_secrets_and_prefers_file_values or production_startup_rejects_fake_auth or production_startup_rejects_insecure_external_urls or production_startup_rejects_unsafe_cors_origins" \
            -q

  secret-scan:
    name: Secrets Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install detect-secrets
        run: python -m pip install --disable-pip-version-check detect-secrets==1.5.0

      - name: Validate secrets against baseline
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        run: uv sync --project backend --frozen --group dev

      - name: Verify backend dependency integrity
        run: uv pip check --project backend

  security-invariants:
    name: Security Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate deployment invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          compose = Path("docker-compose.yml").read_text(encoding="utf-8")
          if "FINAI_ENV=production" in compose and '"8000:8000"' in compose:
              raise SystemExit(
                  "docker-compose.yml expõe backend publicamente em produção. "
                  "Use bind local (127.0.0.1) ou rede interna."
              )

          if "TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS}" not in compose:
              raise SystemExit(
                  "docker-compose.yml precisa propagar TRUSTED_PROXY_CIDRS para backend."
              )

          factory = Path("backend/app/factory.py").read_text(encoding="utf-8")
          if "validate_backend_environment()" not in factory:
              raise SystemExit("backend/app/factory.py precisa validar ambiente no startup.")
          PY
