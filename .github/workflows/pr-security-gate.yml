---
name: PR Security & Quality Gate

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: pr-security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      # v7
      - name: Set up Python 3.12
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Ruff also owns docstring style (`D`, Google convention) and static
      # security rules (`S`), configured in pyproject.toml.
      - name: Lint with Ruff
        run: uv run ruff check src

      - name: Type check with Mypy
        run: |
          uv run --locked mypy src --pretty
          uv run --locked mypy src tests examples scripts \
            --disable-error-code no-untyped-def --pretty

  security-gate:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # v7
      - name: Set up Python 3.12
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Validate uv lock file
        run: uv lock --check

      - name: Static security analysis (Ruff flake8-bandit rules)
        run: uv run ruff check --select S src

      - name: Audit dependency vulnerabilities
        run: uv run pip-audit

      - name: Install detect-secrets
        run: uv pip install detect-secrets==1.5.0

      - name: Scan secrets with detect-secrets
        run: >-
          git ls-files -z | xargs -0 uv run detect-secrets-hook
          --baseline .secrets.baseline

  public-api-invariants:
    name: Public API Surface Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      # v7
      - name: Set up Python 3.12
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # v8.3.2
      - name: Install uv
        uses: >-
          astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Verify public API exports
        run: |
          uv run python - <<'PY'
          import globaldatafinance as gdf

          required_exports = [
              "FundamentalStocksDataCVM",
              "HistoricalQuotesB3",
              "ExtractionResultB3",
          ]

          missing = [
              name for name in required_exports if not hasattr(gdf, name)
          ]
          if missing:
              msg = (
                  "Invariante violada! "
                  f"Exportações ausentes no __init__.py: {missing}"
              )
              raise SystemExit(msg)

          msg = (
              "✅ Todas as exportações públicas "
              f"({required_exports}) estão presentes no pacote root."
          )
          print(msg)
          PY
