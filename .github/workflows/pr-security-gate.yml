---
name: PR Security & Quality Gate

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: pr-security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check src

      - name: Type check with Mypy
        run: uv run mypy src --ignore-missing-imports --pretty

      - name: Check docstrings with pydocstyle
        run: |
          uv run pydocstyle src --convention=google --match-dir=^src \
            --add-ignore=D104,D100,D101,D102,D103,D105,D107,D205,D212,D417,D415

  security-gate:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Validate uv lock file
        run: uv lock --check

      - name: Run Bandit security analysis
        run: uv run bandit -c pyproject.toml -r src -ll

      - name: Audit dependency vulnerabilities
        run: uv run pip-audit --ignore-vuln PYSEC-2026-89

      - name: Install detect-secrets
        run: uv pip install detect-secrets==1.5.0

      - name: Scan secrets with detect-secrets
        run: |
          git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

  public-api-invariants:
    name: Public API Surface Invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Verify public API exports
        run: |
          uv run python - <<'PY'
          import globaldatafinance as gdf

          required_exports = [
              "FundamentalStocksDataCVM",
              "HistoricalQuotesB3",
              "ExtractionResultB3",
          ]

          missing = [name for name in required_exports if not hasattr(gdf, name)]
          if missing:
              raise SystemExit(f"Invariante violada! Exportações ausentes no __init__.py: {missing}")

          print(f"✅ Todas as exportações públicas ({required_exports}) estão presentes no pacote root.")
          PY
