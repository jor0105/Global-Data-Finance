name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight-security:
    name: Preflight Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      - name: Resolve deployment commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend build
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        run: uv sync --project backend --frozen --group dev

      - name: Validate startup fail-closed invariants
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --project backend pytest \
            backend/tests/security/test_data_api_security.py \
            -k "backend_startup_requires_supabase_and_secret_key or production_startup_rejects_fake_auth or production_startup_rejects_insecure_external_urls or production_startup_rejects_unsafe_cors_origins" \
            -q

  build-artifacts:
    name: Build Deployment Artifacts
    runs-on: ubuntu-latest
    needs: preflight-security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      - name: Resolve deployment commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Build backend image
        run: docker build -t finai-backend:${DEPLOY_SHA} -f backend/Dockerfile ./backend

      - name: Build frontend image
        run: docker build -t finai-frontend:${DEPLOY_SHA} -f Dockerfile .

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-artifacts
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      - name: Resolve deployment commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Check staging deploy configuration
        id: staging_config
        env:
          STAGING_DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
          STAGING_HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
        run: |
          is_http_url() {
            case "$1" in
              http://*|https://*) return 0 ;;
              *) return 1 ;;
            esac
          }

          host_from_url() {
            local without_scheme="${1#*://}"
            local without_path="${without_scheme%%/*}"
            printf '%s' "${without_path%%:*}"
          }

          if [ -z "$STAGING_DEPLOY_WEBHOOK_URL" ]; then
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "healthcheck_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_DEPLOY_WEBHOOK_URL is not configured. Skipping staging deploy."
            exit 0
          fi

          if ! is_http_url "$STAGING_DEPLOY_WEBHOOK_URL"; then
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "healthcheck_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_DEPLOY_WEBHOOK_URL is not an HTTP(S) URL. Skipping staging deploy."
            exit 0
          fi

          if ! getent hosts "$(host_from_url "$STAGING_DEPLOY_WEBHOOK_URL")" > /dev/null; then
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "healthcheck_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_DEPLOY_WEBHOOK_URL host does not resolve. Skipping staging deploy."
            exit 0
          fi

          echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"

          if [ -z "$STAGING_HEALTHCHECK_URL" ]; then
            echo "healthcheck_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_HEALTHCHECK_URL is not configured. Deployment will run without post-deploy health verification."
          elif ! is_http_url "$STAGING_HEALTHCHECK_URL"; then
            echo "healthcheck_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_HEALTHCHECK_URL is not an HTTP(S) URL. Skipping post-deploy health verification."
          elif ! getent hosts "$(host_from_url "$STAGING_HEALTHCHECK_URL")" > /dev/null; then
            echo "healthcheck_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_HEALTHCHECK_URL host does not resolve. Skipping post-deploy health verification."
          else
            echo "healthcheck_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger staging deployment webhook
        if: steps.staging_config.outputs.deploy_enabled == 'true'
        env:
          STAGING_DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
          TARGET_REF: ${{ github.event.inputs.git_ref || github.ref_name }}
        run: |
          curl --fail --show-error --silent \
            -X POST "$STAGING_DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${DEPLOY_SHA}\",\"ref\":\"$TARGET_REF\",\"environment\":\"staging\"}"

      - name: Verify staging health
        if: steps.staging_config.outputs.healthcheck_enabled == 'true'
        env:
          STAGING_HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$STAGING_HEALTHCHECK_URL" > /dev/null; then
              echo "Staging healthcheck succeeded on attempt $attempt."
              exit 0
            fi
            echo "Healthcheck attempt $attempt failed. Retrying in 10s..."
            sleep 10
          done

          echo "::error::Staging deployment failed healthcheck."
          exit 1
