---
name: CD - Staging & Pre-release Validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to validate (branch, tag, or SHA)"
        required: false
        default: "main"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-staging-artifacts:
    name: Build & Check Distribution Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build package wheels and sdist
        run: uv build

      - name: Check package metadata with Twine
        run: uvx twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: staging-dist-packages
          path: dist/
          retention-days: 7

  smoke-test-staging:
    name: Staging Functional Smoke Test
    runs-on: ubuntu-latest
    needs: build-staging-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: staging-dist-packages
          path: dist/

      - name: Install built package wheel in isolated environment
        run: |
          uv venv .test-venv
          source .test-venv/bin/activate
          uv pip install dist/*.whl

      - name: Run onboarding smoke test script
        run: |
          source .test-venv/bin/activate
          python -c "import globaldatafinance as gdf; print('✅ GlobalDataFinance successfully imported in clean venv:', gdf.__name__)"
