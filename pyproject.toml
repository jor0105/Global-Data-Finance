[project]
name = "globaldatafinance"
version = "0.1.3"
description = "Library for extracting, normalizing and processing global financial and economic data — including market data from exchanges worldwide, regulatory filings, company fundamentals and historical quotes; optimized for high-performance storage and analysis (e.g., Parquet)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jordan Estralioto", email = "estraliotojordan@gmail.com" }
]
keywords = ["finance", "financial-data", "economic-data", "market-data", "global-markets", "exchanges", "fundamentals", "historical-quotes", "macroeconomics", "parquet", "b3", "cvm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries"
]

requires-python = ">=3.12,<4.0"

dependencies = [
    "pydantic-settings>=2.11.0,<3.0.0",
    "pyarrow>=23.0.1,<24.0.0",
    "httpx[http2]>=0.28.1,<0.29.0",
    "polars>=1.0.0,<2.0.0",
    "psutil>=5.9.0,<7.0.0",
    "pandas>=2.3.3,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/jordanestralioto/Global-Data-Finance"
Repository = "https://github.com/jordanestralioto/Global-Data-Finance"
Documentation = "https://jordanestralioto.github.io/Global-Data-Finance/"
"Bug Tracker" = "https://github.com/jordanestralioto/Global-Data-Finance/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "pydocstyle>=6.3.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocs-static-i18n>=1.2.0",
    "pytest-asyncio>=1.3.0",
    "ipykernel>=7.1.0",
    "pip-audit>=2.9.0",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.5",
    "requests>=2.32.5",
    "pytest-benchmark>=4.0.0",
    "globaldatafinance",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/globaldatafinance"]

[tool.hatch.build]
exclude = [
    "**/cookies_*.py",
    "**/__pycache__",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/globaldatafinance",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pydocstyle]
convention = "google"
match = "(?!test_).*\\.py"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv"]

[tool.bandit.per_file_ignores]
"tests/*" = ["B101", "B108"]

[tool.ruff]
# Blue style: 79 characters line length
line-length = 79

[tool.ruff.lint]
# Curated rule set for a distribution-shaped library. Beyond the default
# E/F (pycodestyle errors + pyflakes) we enable import sorting (I), modern
# syntax (UP), likely-bug detection (B), comprehension (C4) and simplify
# (SIM) hygiene, plus Ruff's own rules (RUF). pydocstyle (D) stays delegated
# to the dedicated pre-commit pydocstyle hook with its Google-convention
# ignores.
select = [
  "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF",
  "S",      # Security (flake8-bandit)
  "PTH",    # Use pathlib (flake8-use-pathlib)
  "ARG",    # Unused arguments (flake8-unused-arguments)
  "LOG",    # Logging best practices (flake8-logging)
]
# E501 (line-too-long) is owned by `ruff-format`.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["globaldatafinance"]

[tool.ruff.lint.per-file-ignores]
# Test suites legitimately use patterns the linter discourages in library
# code: broad `pytest.raises(Exception)` (B017), throwaway loop/unpacked
# vars in parametrized cases (B007/RUF059), nested `with` blocks that
# read more clearly than a combined context (SIM117), test assertions and
# non-cryptographic mock randomness (S101, S108, S110, S311), plus test fixture/mock signatures and path mocking (ARG, PTH).
"tests/**/*.py" = ["B007", "B017", "RUF059", "SIM117", "S101", "S108", "S110", "S311", "ARG", "PTH"]

[tool.ruff.format]
# Blue style: Single quotes
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.sources]
globaldatafinance = { workspace = true }
