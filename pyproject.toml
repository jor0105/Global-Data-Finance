[project]
name = "globaldatafinance"
version = "0.2.0"
description = "Library for extracting, normalizing and processing global financial and economic data — including market data from exchanges worldwide, regulatory filings, company fundamentals and historical quotes; optimized for high-performance storage and analysis (e.g., Parquet)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jordan Estralioto", email = "estraliotojordan@gmail.com" }
]
keywords = ["finance", "financial-data", "economic-data", "market-data", "global-markets", "exchanges", "fundamentals", "historical-quotes", "macroeconomics", "parquet", "b3", "cvm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries"
]

requires-python = ">=3.12,<4.0"

dependencies = [
    "pydantic-settings>=2.11.0,<3.0.0",
    "pyarrow>=23.0.1,<24.0.0",
    "httpx[http2]>=0.28.1,<0.29.0",
    "polars>=1.0.0,<2.0.0",
    "psutil>=5.9.0,<7.0.0",
    "pandas>=2.3.3,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/jordanestralioto/Global-Data-Finance"
Repository = "https://github.com/jordanestralioto/Global-Data-Finance"
Documentation = "https://jordanestralioto.github.io/Global-Data-Finance/"
"Bug Tracker" = "https://github.com/jordanestralioto/Global-Data-Finance/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "mkdocs-static-i18n>=1.2.0",
    "pytest-asyncio>=1.3.0",
    "ipykernel>=7.1.0",
    "pip-audit>=2.9.0",
    "mdformat>=0.7.17",
    "mdformat-gfm>=0.3.5",
    "requests>=2.32.5",
    "pytest-benchmark>=4.0.0",
    "import-linter>=2.0",
    # Also needed as CLIs: the workflows call `uv run ruff` and
    # `uv run detect-secrets-hook` directly, and pre-commit's isolated hook
    # venvs do not put anything on the project environment. Keep these ranges
    # matching the `rev:` pins in .pre-commit-config.yaml so the CLI and the
    # hook never disagree about what is a violation.
    "ruff>=0.16.2,<0.17",
    "detect-secrets>=1.5.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/globaldatafinance"]

[tool.hatch.build]
exclude = [
    "**/cookies_*.py",
    "**/__pycache__",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/globaldatafinance",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["pandas", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
# These used to live as [coverage:*] sections in pytest.ini, where coverage.py
# never read them -- it only looks at .coveragerc, setup.cfg, tox.ini and this
# file. That is why every caller had to repeat `--cov=src --cov-fail-under=70`
# on the command line.
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
# Blue style: 79 characters line length
line-length = 79

[tool.ruff.lint]
# Curated rule set for a distribution-shaped library. Beyond the default
# E/F (pycodestyle errors + pyflakes) we enable import sorting (I), modern
# syntax (UP), likely-bug detection (B), comprehension (C4) and simplify
# (SIM) hygiene, plus Ruff's own rules (RUF). Ruff also owns what used to be
# two extra hooks: `S` replaces Bandit and `D` replaces pydocstyle (archived
# upstream), keeping the same Google convention and ignore list.
select = [
  "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF",
  "S",      # Security (flake8-bandit)
  "PTH",    # Use pathlib (flake8-use-pathlib)
  "ARG",    # Unused arguments (flake8-unused-arguments)
  "LOG",    # Logging best practices (flake8-logging)
  "D",      # Docstrings (pydocstyle, Google convention)
]
# E501 (line-too-long) is owned by `ruff-format`.
ignore = [
  "E501",
  # Google-convention docstring rules intentionally relaxed (previously
  # carried by the standalone pydocstyle hook, now retired upstream).
  "D100", "D101", "D102", "D103", "D104", "D105", "D107",
  "D205", "D212", "D415", "D417",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["globaldatafinance"]

[tool.ruff.lint.per-file-ignores]
# Test suites legitimately use pytest assertions and a small set of fixture
# conventions. Security-sensitive path, exception, cleanup and randomness
# findings remain enabled and must be fixed at their individual call sites.
"tests/**/*.py" = ["B007", "RUF059", "SIM117", "S101", "ARG", "PTH", "D"]

[tool.ruff.format]
# Blue style: Single quotes
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.sources]
globaldatafinance = { workspace = true }

# ---------------------------------------------------------------------------
# Import-time architecture contracts (import-linter)
# ---------------------------------------------------------------------------
# Ruff and mypy validate code inside a module; these contracts validate the
# shape of the import graph between modules -- circular imports and layering
# violations that no linter here would otherwise catch.
[tool.importlinter]
root_package = "globaldatafinance"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "globaldatafinance.application : globaldatafinance.brazil",
    "globaldatafinance.macro_infra",
    "globaldatafinance.core",
    "globaldatafinance.macro_exceptions",
]

# NOTE: cycle detection is NOT expressible as an import-linter contract -- a
# layers contract cannot see a submodule importing its own package root. That
# check lives in .github/hooks/check-import-cycles.py.
